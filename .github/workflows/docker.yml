name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: key_pool
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        # GHCR 包可见性独立于仓库（org 包的 PATCH API 在外部 token 下常 404，
        # 是已知坑），在 workflow 内用 GITHUB_TOKEN 改最可靠。幂等，失败不阻断。
        continue-on-error: true
        run: |
          for i in $(seq 1 5); do
            code=$(curl -s -o /tmp/pkg.json -w "%{http_code}" -X PATCH \
              "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/key-yes" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -d '{"visibility":"public"}')
            echo "尝试 $i: HTTP $code"
            [ "$code" = "200" ] && break
            cat /tmp/pkg.json | head -5
            sleep 5
          done

      - name: Smoke test image
        run: |
          docker run -d --name key-pool-smoke -p 18787:8787 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18787/healthz; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "===== 冒烟失败，容器日志 ====="
            docker logs key-pool-smoke
            docker rm -f key-pool-smoke
            exit 1
          fi
          curl -sf http://127.0.0.1:18787/admin/panel/status
          echo "镜像冒烟通过"
          docker rm -f key-pool-smoke
