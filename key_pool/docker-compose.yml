services:
  key-pool:
    build: .
    container_name: mistral-key-pool
    ports:
      - "8787:8787"
    volumes:
      # 数据持久化：池数据、面板密码、日志、本地配置覆盖
      - ./pool_data.json:/data/pool_data.json
      - ./panel_auth.json:/data/panel_auth.json
      - ./logs:/data/logs
      # 需要覆盖配置时取消注释（例如改 pool_api_keys / admin_key / 代理）：
      # - ./key_pool_config.local.json:/data/key_pool_config.local.json
    restart: unless-stopped
    # 国内机器需要代理时取消注释并修改地址：
    # environment:
    #   - HTTP_PROXY=http://host.docker.internal:7897
    #   - HTTPS_PROXY=http://host.docker.internal:7897
