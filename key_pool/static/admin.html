<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mistral Key 池管理</title>
<style>
  :root { --bg:#0f1117; --card:#171a23; --line:#262b38; --text:#e6e9f2; --dim:#8b93a7;
          --accent:#6c8cff; --ok:#3fb96f; --warn:#e0a84a; --bad:#e05a5a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; padding:24px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .num { font-size:26px; font-weight:600; margin-top:4px; }
  .card .lbl { color:var(--dim); font-size:12px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:20px; }
  .panel h2 { font-size:15px; margin-bottom:12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=password] { background:#0d0f15; border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 12px; font-size:13px; flex:1; min-width:260px; }
  button { background:var(--accent); border:none; color:#fff; border-radius:8px;
    padding:9px 16px; font-size:13px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--dim); }
  button.small { padding:4px 10px; font-size:12px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; line-height:1.7; }
  .report { margin-top:10px; font-size:13px; line-height:1.8; white-space:pre-wrap; display:none;
    background:#0d0f15; border:1px solid var(--line); border-radius:8px; padding:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; }
  .tag.active { color:var(--ok); background:rgba(63,185,111,.12); }
  .tag.disabled { color:var(--warn); background:rgba(224,168,74,.12); }
  .tag.invalid { color:var(--bad); background:rgba(224,90,90,.12); }
  .toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  select { background:#0d0f15; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 10px; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:26px; text-align:center;
    color:var(--dim); cursor:pointer; transition:.15s; }
  .drop.hover { border-color:var(--accent); color:var(--text); }
  .mono { font-family:Consolas,monospace; }

  /* 登录/初始化遮罩 */
  #gate { position:fixed; inset:0; background:var(--bg); display:flex;
    align-items:center; justify-content:center; z-index:99; }
  #gate.hidden { display:none; }
  .gate-card { background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:28px; width:360px; max-width:92vw; }
  .gate-card h2 { font-size:16px; margin-bottom:6px; }
  .gate-card .desc { color:var(--dim); font-size:12px; margin-bottom:16px; line-height:1.6; }
  .gate-card input { width:100%; min-width:0; margin-bottom:10px; }
  .gate-msg { color:var(--bad); font-size:12px; min-height:16px; margin-bottom:8px; }
  .gate-card button { width:100%; }
  #logout { float:right; margin-top:-30px; }
</style>
</head>
<body>

<div id="gate" class="hidden">
  <div class="gate-card">
    <h2 id="gateTitle">登录管理面板</h2>
    <div class="desc" id="gateDesc">输入面板密码继续。</div>
    <div class="gate-msg" id="gateMsg"></div>
    <input type="password" id="gatePassword" placeholder="面板密码（至少 6 位）"
           autocomplete="current-password" maxlength="128">
    <input type="password" id="gatePassword2" placeholder="再输入一次确认" style="display:none"
           autocomplete="new-password" maxlength="128">
    <button id="gateSubmit">进入</button>
  </div>
</div>

<h1>Mistral Key 号池</h1>
<div class="sub">批量导入 / 轮询调度 / OpenAI·Claude·Gemini·TTS 多格式网关</div>
<button class="ghost small" id="logout">退出登录</button>

<div class="cards" id="stats"></div>

<div class="panel">
  <h2>批量导入</h2>
  <div class="drop" id="drop">拖拽 .txt / .zip 到这里，或点击选择文件<br>
  <span class="hint" style="margin-top:4px">支持：单个 TXT、ZIP 平铺 TXT、ZIP 内文件夹嵌套 TXT</span></div>
  <input type="file" id="file" accept=".txt,.zip" hidden multiple>
  <div class="row" style="margin-top:12px">
    <input type="text" id="path" placeholder="或输入本地路径：D:\keys\mistral_keys（文件夹）或 D:\keys\batch.zip 或单个 txt">
    <button id="importPath">从路径导入</button>
  </div>
  <div class="report mono" id="report"></div>
  <div class="hint">
    每行格式自动识别：纯 Key、<span class="mono">邮箱----密码----Key</span>、<span class="mono">邮箱:Key</span>、逗号/空格分隔等。
    mistral_keys/&lt;邮箱&gt;.txt 单 Key 文件会自动把邮箱记为备注。
  </div>
</div>

<div class="panel">
  <h2>Key 列表</h2>
  <div class="toolbar">
    <select id="filter">
      <option value="">全部状态</option>
      <option value="active">可用</option>
      <option value="disabled">已禁用</option>
      <option value="invalid">已失效</option>
    </select>
    <button class="ghost small" id="refresh">刷新</button>
    <button class="ghost small" id="export">导出全部 TXT</button>
    <button class="ghost small" id="clearInvalid">清空失效</button>
  </div>
  <div style="overflow:auto; max-height:480px">
    <table>
      <thead><tr><th>ID</th><th>Key</th><th>备注</th><th>来源</th><th>状态</th>
      <th>调用</th><th>失败</th><th>最近使用</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script src="/static/admin.js"></script>
</body>
</html>
