# 本地构建版：拉不动 GHCR 镜像时用这个（无需修改任何内容）。
#
# 用法（在 key_pool 目录下）：
#   mkdir -p data
#   docker compose -f docker-compose.build.yml up -d --build
#
# 注意：构建需要从 Docker Hub 拉 python:3.12-slim 基础镜像，
# 国内服务器如卡在拉基础镜像，先配置镜像加速（见 README 故障排查）。

services:
  key-pool:
    build: .
    container_name: mistral-key-pool
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    restart: unless-stopped
